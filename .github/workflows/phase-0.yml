name: RULER 检查与测试包
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: phase-0-${{ github.head_ref || github.ref_name }}
  cancel-in-progress: true
jobs:
  backend:
    name: 后端与开发服务
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
          cache-dependency-path: backend/package-lock.json
      - name: 扫描敏感文件
        run: python3 scripts/check-secrets.py
      - name: 初始化虚构开发环境
        run: |
          node scripts/init-dev.mjs
          node scripts/init-auth-dev.mjs
          node scripts/init-storage-dev.mjs
          bash scripts/prepare-minio.sh
          docker compose up -d --build --wait --wait-timeout 120
      - name: 按锁文件安装并生成 Prisma
        working-directory: backend
        run: |
          npm ci --no-audit --no-fund
          npm run prisma:generate
          npm run prisma:validate
      - name: 真实迁移与重复执行检查
        working-directory: backend
        run: |
          npm run db:migrate
          npm run db:migrate
      - name: lint、类型检查、单测与覆盖率
        working-directory: backend
        run: |
          npm run lint
          npm run typecheck
          npm run test:coverage
          npm run build
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-auth-validation
          path: |
            test-results/auth-validation.json
            test-results/auth-acceptance.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-case-validation
          path: |
            test-results/case-validation.json
            test-results/case-acceptance.html
          if-no-files-found: error
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-storage-validation
          path: |
            test-results/storage-validation.json
            test-results/storage-acceptance.html
          if-no-files-found: error
          retention-days: 14
      - name: PostgreSQL、Redis、MinIO 功能检查
        working-directory: backend
        run: npm run test:integration
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-task-validation
          path: |
            test-results/task-validation.json
            test-results/task-acceptance.html
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-document-validation
          path: |
            test-results/document-validation.json
            test-results/document-acceptance.html
          if-no-files-found: error
          retention-days: 14
      - name: 空库、阶段0升级及数据库安全约束
        working-directory: backend
        run: npm run test:database
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-schema-validation
          path: test-results/schema-database.json
          if-no-files-found: error
      - name: 实际启动已构建后端并检查 HTTP
        working-directory: backend
        shell: bash
        run: |
          node --env-file=../.env ../scripts/prepare-storage-dev.mjs
          node --env-file=../.env dist/main.js &
          app_pid=$!
          trap 'kill "$app_pid" 2>/dev/null || true; wait "$app_pid" 2>/dev/null || true' EXIT
          node --env-file=../.env ../scripts/http-smoke.mjs
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: 真实 Dart 客户端连接 Nest、隔离数据库与 MinIO
        run: |
          cd client
          flutter pub get --enforce-lockfile
          cd ..
          node --env-file=.env scripts/test-client-api.mjs
          node scripts/render-client-api-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-client-api-validation
          path: |
            test-results/client-api-validation.json
            test-results/client-api-acceptance.html
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-backend-coverage
          path: backend/coverage/
          if-no-files-found: error
      - name: 停止本次 CI 开发容器
        if: always()
        run: docker compose down --volumes
  flutter-tests:
    name: Flutter 分析与真实测试
    runs-on: ubuntu-24.04
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: 安装、格式与分析
        working-directory: client
        run: |
          flutter pub get --enforce-lockfile
          dart format --output=none --set-exit-if-changed lib test tool
          flutter analyze --no-pub
      - name: Widget 与 Provider 测试
        working-directory: client
        env:
          RULER_TEST_CJK_FONT: /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc
        run: |
          if [ ! -f /usr/share/fonts/opentype/noto/NotoSansCJK-Regular.ttc ]; then
            sudo apt-get update
            sudo apt-get install -y fonts-noto-cjk
          fi
          mkdir -p ../test-results
          flutter test --no-pub --coverage --machine > ../test-results/client-validation-events.jsonl
          node ../scripts/render-client-report.mjs
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-client-experience
          path: |
            test-results/client-acceptance.html
            test-results/client-validation.json
            test-results/client-experience-task.png
            test-results/client-online-task.png
            test-results/client-files.png
            test-results/client-validation-events.jsonl
          if-no-files-found: error
          retention-days: 14
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-flutter-coverage
          path: client/coverage/lcov.info
          if-no-files-found: error
  android:
    name: Android debug APK
    needs: [backend, flutter-tests]
    runs-on: ubuntu-24.04
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: 构建测试 APK
        working-directory: client
        run: |
          flutter pub get --enforce-lockfile
          flutter build apk --debug --no-pub
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-android-debug-apk
          path: client/build/app/outputs/flutter-apk/app-debug.apk
          if-no-files-found: error
          retention-days: 14
  windows:
    name: Windows 测试 ZIP
    needs: [backend, flutter-tests]
    runs-on: windows-2022
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.38.7"
          channel: stable
          cache: true
      - name: 构建 Windows 测试包
        working-directory: client
        run: |
          flutter pub get --enforce-lockfile
          flutter build windows --release --no-pub
      - name: 包含 Windows 所需的 Visual C++ 运行库
        working-directory: client
        shell: pwsh
        run: |
          $vswhere = "${env:ProgramFiles(x86)}\Microsoft Visual Studio\Installer\vswhere.exe"
          $vsPath = & $vswhere -latest -products * -requires Microsoft.VisualStudio.Component.VC.Tools.x86.x64 -property installationPath
          if (-not $vsPath) { throw "缺少官方 Visual Studio C++ 运行库来源" }
          $crtPaths = @("$vsPath\VC\Redist\MSVC\v143\x64\Microsoft.VC143.CRT")
          $crtPaths += Get-ChildItem "$vsPath\VC\Redist\MSVC" -Directory |
            Where-Object { $_.Name -match '^\d+(\.\d+){1,3}$' } |
            Sort-Object { [version]$_.Name } -Descending |
            ForEach-Object { Join-Path $_.FullName "x64\Microsoft.VC143.CRT" }
          $crtPath = $crtPaths | Where-Object { $_ -and (Test-Path $_ -PathType Container) } | Select-Object -First 1
          if (-not $crtPath) { throw "未找到官方 x64 CRT 目录" }
          Copy-Item "$crtPath\*.dll" build/windows/x64/runner/Release/
          foreach ($name in @("ruler_client.exe", "flutter_windows.dll", "msvcp140.dll", "vcruntime140.dll", "vcruntime140_1.dll", "data/")) {
            if (-not (Test-Path "build/windows/x64/runner/Release/$name")) { throw "Windows 包缺少 $name" }
          }
          Compress-Archive -Path build/windows/x64/runner/Release/* -DestinationPath ruler-windows-test.zip
      - uses: actions/upload-artifact@v4
        with:
          name: ruler-windows-test-zip
          path: client/ruler-windows-test.zip
          if-no-files-found: error
          retention-days: 14
